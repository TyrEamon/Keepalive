name: IAMHC AI 多账号每日签到

on:
  schedule:
    # UTC 16:10
    # 北京时间次日 00:10
    # 日本时间次日 01:10
    - cron: "10 16 * * *"

  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: ./iamhc

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v5

      - name: 🐍 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: iamhc/requirements.txt

      - name: 📦 安装依赖
        run: pip install -r requirements.txt

      - name: 🔍 检查多账号配置
        env:
          IAMHC_ACCOUNTS_JSON: ${{ secrets.IAMHC_ACCOUNTS_JSON }}
        run: |
          if [[ -z "${IAMHC_ACCOUNTS_JSON:-}" ]]; then
            echo "❌ 未读取到 IAMHC_ACCOUNTS_JSON"
            exit 1
          fi
          echo "✅ IAMHC_ACCOUNTS_JSON 已读取"

      - name: ✅ 执行多账号签到
        env:
          IAMHC_ACCOUNTS_JSON: ${{ secrets.IAMHC_ACCOUNTS_JSON }}

          # 账号未单独填写 base_url 时使用这个默认地址
          IAMHC_BASE_URL: ${{ vars.IAMHC_BASE_URL }}

          # 两个账号之间的等待时间，避免瞬间连续请求
          CHECKIN_INTERVAL_SECONDS: "1.5"

          # Telegram 通知，可不配置
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python checkin.py

      - name: 💾 可选写回更新后的账号 Session
        if: always()
        continue-on-error: true
        env:
          # Fine-grained PAT，需要当前仓库 Secrets: Read and write
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [[ ! -f accounts.updated.json ]]; then
            echo "⏭️ 没有生成 accounts.updated.json，跳过写回"
            exit 0
          fi

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "⚠️ 未配置 GH_TOKEN，跳过 Session 自动写回"
            rm -f accounts.updated.json
            exit 0
          fi

          echo "正在更新 IAMHC_ACCOUNTS_JSON Secret……"

          if gh secret set IAMHC_ACCOUNTS_JSON \
            --repo "${{ github.repository }}" \
            < accounts.updated.json; then
            echo "✅ IAMHC_ACCOUNTS_JSON Secret 更新成功"
          else
            echo "⚠️ Secret 写回失败，但不影响本次签到结果"
          fi

          rm -f accounts.updated.json
