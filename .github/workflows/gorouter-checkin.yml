name: GoRouter 多账号每日签到

on:
  schedule:
    # UTC 16:20
    # 北京时间次日 00:20
    # 日本时间次日 01:20
    - cron: "20 16 * * *"

  # 支持在 Actions 页面手动运行
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: ./gorouter

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gorouter/requirements.txt

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq
          pip install -r requirements.txt
          seleniumbase install chromedriver

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🔍 检查多账号配置
        env:
          GOROUTER_ACCOUNTS_JSON: ${{ secrets.GOROUTER_ACCOUNTS_JSON }}
        run: |
          if [[ -n "${GOROUTER_ACCOUNTS_JSON:-}" ]]; then
            echo "✅ GOROUTER_ACCOUNTS_JSON 已读取"
          else
            echo "❌ GOROUTER_ACCOUNTS_JSON 未读取"
            exit 1
          fi

      - name: ✅ 执行多账号签到（seleniumbase UC + Turnstile 自动绕过）
        env:
          GOROUTER_ACCOUNTS_JSON: ${{ secrets.GOROUTER_ACCOUNTS_JSON }}

          # 每个账号之间等待的秒数
          CHECKIN_INTERVAL_SECONDS: "1.5"

          # Telegram 通知，可不配置
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          # 代理配置（如果 NODE_LINK 设置了，sing-box 会启动本地 socks5 代理）
          IS_PROXY: "true"
          PROXY_SERVER: "socks5://127.0.0.1:1080"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python checkin_turnstile.py

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true

      - name: 💾 可选更新多账号 Secret
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [[ ! -f accounts.updated.json ]]; then
            echo "⏭️ 没有生成 accounts.updated.json，跳过写回"
            exit 0
          fi

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "⚠️ 未配置 GH_TOKEN，跳过自动写回"
            rm -f accounts.updated.json
            exit 0
          fi

          echo "正在更新 GOROUTER_ACCOUNTS_JSON Secret……"

          gh secret set GOROUTER_ACCOUNTS_JSON \
            --body "$(cat accounts.updated.json)" \
            --repo "${{ github.repository }}"

          echo "✅ GOROUTER_ACCOUNTS_JSON Secret 更新成功"
          rm -f accounts.updated.json