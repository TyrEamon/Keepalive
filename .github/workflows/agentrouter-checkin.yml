name: AgentRouter 每日签到

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 安装依赖
        working-directory: ./agentrouter
        run: pip install -r requirements.txt

      - name: ✅ 执行签到
        working-directory: ./agentrouter
        env:
          AGENTROUTER_BASE_URL: ${{ vars.AGENTROUTER_BASE_URL }}
          AGENTROUTER_USER_ID: ${{ vars.AGENTROUTER_USER_ID }}
          AGENTROUTER_ACCESS_TOKEN: ${{ vars.AGENTROUTER_ACCESS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python checkin.py
